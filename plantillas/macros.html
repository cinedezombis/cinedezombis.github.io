{% macro manchas(n, clase='') -%}
<span class="manchas {{ clase }}" style="--n:{{ n }}" role="img" aria-label="{{ n }} de 5 manchas de sangre"></span>
{%- endmacro %}

{% macro fila(p, raiz) -%}
<li class="fila" data-id="{{ p.id }}" data-v="{{ p.valoracion }}" data-busca="{{ p.busca }}">
  <a class="fila-enlace" href="{{ raiz }}{{ p.ruta.lstrip('/') }}">
    <span class="fila-anio">{{ p.anio }}</span>
    {% if p.cartel %}<img class="fila-cartel" src="{{ raiz }}img/miniaturas/{{ p.miniatura_webp }}" alt="" width="40" height="58" loading="lazy" decoding="async">{% else %}<span class="fila-cartel"></span>{% endif %}
    <span class="fila-titulo">{{ p.titulo }}</span>
    {{ manchas(p.valoracion) }}
  </a>
</li>
{%- endmacro %}
