# Ajustes de la web. Solo hay que tocarlos al decidir dónde se publica.

# Dirección pública de la web, sin barra final. Se usa para las direcciones canónicas.
# Ejemplos: https://cinedezombis.github.io   o   https://usuario.github.io/proyecto
url: "https://cinedezombis.github.io"

# Carpeta desde la que se sirve la web: "/" si está en la raíz del dominio
# (cinedezombis.github.io) o "/proyecto/" si es un repositorio de proyecto
# (usuario.github.io/proyecto). Solo la usa la página de error 404.
ruta_base: "/"

# DOI del libro en Zenodo. Es el DOI general, que apunta siempre a la última versión publicada
# (el de la versión 1.0, 10.5281/zenodo.24590777, es el que va impreso en el libro).
libro_doi: "10.5281/zenodo.24590776"

# Estadísticas de visitas con GoatCounter (sin cookies ni datos personales).
# Es el código de la cuenta: el panel está en https://cinedezombis.goatcounter.com
# Déjalo vacío ("") para desactivar el contador.
goatcounter: "cinedezombis"

# Verificación de Google Search Console (propiedad «Prefijo de la URL»). Debe quedarse puesta:
# si se quita, Search Console deja de considerar verificada la web. Vacío ("") para no añadirla.
google_verificacion: "utno5owQU-NdUkeZAnVNejF8fEyh2ieWE8lT16rH0xI"
