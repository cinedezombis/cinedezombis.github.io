# Películas descartadas del atlas. Aparecen en «Sobre el atlas», debajo del criterio que las deja fuera.
# grupo: infectados, posesiones, fantasmas, imaginario, hipnotizados, animales, mutantes, esqueletos,
#        sin-muertos, cortos, documentales, animacion o musicales.
# titulo: el título en España (si no se estrenó aquí, el original). original: el título original;
#   si coincide con el de España, no se muestra.
# Solo entra una película si el motivo es seguro; en caso de duda, no se añade.
# El grupo «imaginario» (vampiros, momias...) no lleva lista: son demasiadas.
# Un criterio sin películas no muestra nada; el desplegable aparece al añadir la primera.
# Para añadir una, copia una entrada y cambia los datos.

